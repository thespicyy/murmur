<meta charset="utf-8">
<title>Murmur — maquette Insights</title>
<link rel="stylesheet" href="style.css">

<!-- Maquette : la page Insights rendue en HTML dans une fenetre WebView2.
     Les donnees viennent de la vraie base, injectees par `lancer.py`. -->

<header class="titre">
  <button class="volet" onclick="basculerVolet()" title="Replier la barre">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
      <line x1="9.5" y1="5" x2="9.5" y2="19"/>
    </svg>
  </button>
  <div class="commandes">
    <button class="commande" onclick="pont('reduire')" title="Réduire">
      <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="1.8"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="commande" onclick="pont('agrandir')" title="Agrandir">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
    </button>
    <button class="commande fermer" onclick="pont('fermer')" title="Fermer">
      <svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="1.8">
        <line x1="6" y1="6" x2="18" y2="18"/>
        <line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
</header>

<div class="corps">
  <aside class="laterale">
    <div class="marque">
      <svg width="22" height="22" viewBox="0 0 96 96" fill="none"
           stroke="currentColor" stroke-width="6">
        <path d="M62 20a34 34 0 1 0 0 56"/>
        <circle cx="55" cy="48" r="7" fill="currentColor" stroke="none"/>
      </svg>
      <span>Murmur</span>
    </div>
    <nav>
      <div class="onglet"><svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="9.5" y="3" width="5" height="10.5" rx="2.5"/>
        <path d="M6.5 11a5.5 5.5 0 0 0 11 0"/>
        <line x1="12" y1="16.5" x2="12" y2="20"/>
        <line x1="8.5" y1="20" x2="15.5" y2="20"/></svg><span>Dictation</span></div>

      <div class="onglet"><svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 6.5v12.5M12 6.5 5 5v12.5L12 19M12 6.5 19 5v12.5L12 19"/>
        </svg><span>Dictionary</span></div>

      <div class="onglet actif"><svg width="20" height="20" viewBox="0 0 24 24"
        fill="currentColor">
        <rect x="4.5" y="13" width="3.5" height="6.5" rx="1"/>
        <rect x="10.25" y="5.5" width="3.5" height="14" rx="1"/>
        <rect x="16" y="10" width="3.5" height="9.5" rx="1"/></svg
        ><span>Insights</span></div>

      <div class="lien"><svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="4.5" y1="7" x2="19.5" y2="7"/>
        <line x1="4.5" y1="12" x2="19.5" y2="12"/>
        <line x1="4.5" y1="17" x2="19.5" y2="17"/>
        <circle cx="15" cy="7" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="8.5" cy="12" r="2.6" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="17" r="2.6" fill="currentColor" stroke="none"/>
        </svg><span>Settings</span></div>
    </nav>
  </aside>

  <main class="panneau">
    <div class="entete">
      <h1>Insights</h1>
      <p>what dictation has saved you</p>
    </div>

    <section class="grille">
      <article class="carte">
        <div class="chiffre" id="vitesse">—</div>
        <div class="legende">WORDS PER MINUTE</div>
        <figure class="jauge">
          <svg viewBox="0 0 200 108">
            <path class="arc rail" d="M14 100a86 86 0 0 1 172 0"
                  stroke-width="14"/>
            <path class="arc actif" id="arc" d="M14 100a86 86 0 0 1 172 0"
                  stroke-width="14" stroke-dasharray="270"
                  stroke-dashoffset="270"/>
          </svg>
          <figcaption>
            <div class="rapport" id="rapport">—</div>
            <div class="sous">typing</div>
          </figcaption>
        </figure>
      </article>

      <article class="carte">
        <div class="chiffre" id="corrections">—</div>
        <div class="legende">FIXES LEARNED</div>
        <div class="filet"></div>
        <div class="detail"><b id="termes">—</b>dictionary entries</div>
        <div class="detail"><b id="remplacements">—</b>dictionary fixes</div>
      </article>

      <article class="carte">
        <span class="tendance" id="tendance"></span>
        <div class="chiffre" id="mots">—</div>
        <div class="legende">TOTAL WORDS DICTATED</div>
        <div class="filet"></div>
        <div class="detail" id="dictees">—</div>
        <div class="detail" id="gagne">—</div>
      </article>
    </section>

    <section class="grille large">
      <article class="carte">
        <div class="titre-carte">
          <h2>Desktop usage</h2><span id="nb-apps"></span>
        </div>
        <ul class="usage" id="usage"></ul>
      </article>

      <article class="carte">
        <div class="titre-carte">
          <h2>Activity</h2><span id="serie"></span>
        </div>
        <div class="mois" id="mois"></div>
        <div class="calendrier">
          <div class="jours" id="jours"></div>
          <div class="grille-jours" id="cases"></div>
        </div>
      </article>
    </section>
  </main>
</div>

<footer class="pied">
  <span id="pied-gauche"></span><span id="pied-droite"></span>
</footer>

<script>const DONNEES = /*{{DONNEES}}*/ {};</script>
<script src="page.js"></script>
