<meta charset="utf-8">
<title>Murmur</title>
<link rel="stylesheet" href="style.css">

<!-- Le bord haut a été rendu à la page pour que la barre commence au pixel
     zéro : Windows n'y voit donc plus de poignée de redimensionnement, et
     cette bande la lui rend. -->
<div id="poignee-haut"></div>

<header class="titre">
  <button class="volet" id="volet" title="Replier">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8">
      <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
      <line x1="9.5" y1="5" x2="9.5" y2="19"/>
    </svg>
  </button>
  <!-- Les glyphes occupent presque toute la boite, en trait de deux pixels :
       c'est ce qui les fait lire comme des commandes de fenetre et non comme
       de petits pictogrammes. La surface visee, elle, ne bouge pas — elle
       etait deja bonne a 46 x 52 px. Mesures finales : barre de 15 px, carre
       de 13, croix de 11, trait de 1,8 px. -->
  <div class="commandes">
    <button class="commande" data-fenetre="reduire">
      <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"/></svg>
    </button>
    <button class="commande" data-fenetre="agrandir">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.4">
        <rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/></svg>
    </button>
    <button class="commande fermer" data-fenetre="fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round">
        <line x1="4.5" y1="4.5" x2="19.5" y2="19.5"/>
        <line x1="19.5" y1="4.5" x2="4.5" y2="19.5"/></svg>
    </button>
  </div>
</header>

<div class="corps">
  <aside class="laterale">
    <div class="marque">
  <svg width="22" height="22" viewBox="0 0 96 96" fill="none"
       stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <g transform="translate(7,0)">
      <path d="M48 22a26 26 0 0 1 0 52"/>
      <path d="M48 88a40 40 0 0 1 0-80"/>
      <circle cx="48" cy="48" r="7" fill="currentColor" stroke="none"/>
    </g>
  </svg>
      <span>Murmur</span>
    </div>
    <nav id="onglets"></nav>
  </aside>
  <main class="panneau" id="panneau"></main>
</div>

<footer class="pied">
  <span id="pied-gauche"></span><span id="pied-droite"></span>
</footer>

<script src="pictos.js"></script>
<script src="app.js"></script>
