[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
markers =
    lent: demarre reellement le moteur et charge le modele (quelques secondes)
    materiel: necessite un peripherique reel (micro, clavier, fenetre)

filterwarnings =
    error::DeprecationWarning:murmur.*
    # sounddevice 0.5.6 affecte .shape sur un tableau numpy, deprecie en 2.5.
    # Bruit provenant d'une dependance, pas de notre code — mais il annonce
    # une rupture future : a surveiller lors des montees de version numpy.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
